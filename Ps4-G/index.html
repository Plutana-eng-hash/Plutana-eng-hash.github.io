<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Library</title>
<style>
:root{--bg:#F2F4F1;--ink:#17201C;--muted:#5B665F;--line:#D9DED7;--line-soft:#E1E5DF;--accent:#1F6F54;--accent-dark:#185A44;--tint:#E3EFE9;--tile:#EEF1ED;--danger:#B3261E}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3,p,dl,dd,dt{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{max-width:80rem;margin:0 auto;padding:2.5rem 1rem}
@media(min-width:640px){.wrap{padding:2.5rem 1.5rem}}
@media(min-width:1024px){.wrap{padding:2.5rem 2rem}}

.head{display:flex;flex-direction:column;gap:1.25rem}
@media(min-width:640px){.head{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.title{font-size:1.875rem;line-height:1.15;font-weight:600;letter-spacing:-.02em}
@media(min-width:640px){.title{font-size:2.25rem}}
.count{margin-top:.5rem;font-size:.875rem;color:var(--muted)}
.search{width:100%}
@media(min-width:640px){.search{width:18rem}}
.search input{width:100%;padding:.625rem .75rem;font-size:.875rem;background:#fff;border:1px solid #C9D0C7;border-radius:.5rem}
.search input::placeholder{color:#7A857E}
.search input:focus{border-color:var(--accent)}

main{margin-top:2rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(16.5rem,1fr))}

.card{display:flex;flex-direction:column;width:100%;height:100%;padding:1.25rem;text-align:left;background:#fff;border:1px solid var(--line);border-radius:.75rem;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;align-items:center;gap:.75rem}
.card-titles{min-width:0;flex:1}
.card-name{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;margin-top:.25rem;padding:.125rem .5rem;font-size:.75rem;font-weight:500;color:var(--accent);background:var(--tint);border-radius:999px}
.card-desc{flex:1;margin-top:1rem;font-size:.875rem;line-height:1.5rem;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.card-cta{margin-top:1.25rem;font-size:.875rem;font-weight:500;color:var(--accent)}

.icon{display:flex;flex-shrink:0;align-items:center;justify-content:center;overflow:hidden;background:var(--tile);border:1px solid var(--line-soft);border-radius:.75rem}
.icon-md{width:3rem;height:3rem}
.icon-lg{width:3.5rem;height:3.5rem}
.icon img{width:100%;height:100%;object-fit:cover}
.icon-initial{font-size:1.125rem;font-weight:600;color:var(--accent)}

.skeleton{background:linear-gradient(90deg,#e3e7e2 25%,#eef1ed 50%,#e3e7e2 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:.375rem}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-card{padding:1.25rem;background:#fff;border:1px solid var(--line);border-radius:.75rem}
.sk-row{display:flex;align-items:center;gap:.75rem}
.sk-lines{flex:1;display:grid;gap:.5rem}
.sk-body{display:grid;gap:.5rem;margin-top:1.25rem}

.empty{padding:3.5rem 1.5rem;text-align:center;background:rgba(255,255,255,.6);border:1px dashed #BFC8BD;border-radius:.75rem}
.empty-title{font-size:1rem;font-weight:500}
.empty-sub{margin-top:.25rem;font-size:.875rem;color:var(--muted)}

.error{max-width:36rem;padding:1.5rem;background:#fff;border:1px solid #E3B7B3;border-radius:.75rem}
.error-title{font-size:1.125rem;font-weight:600;color:var(--danger)}
.error-msg{margin-top:.5rem;font-size:.875rem;line-height:1.5rem;color:var(--muted)}

.btn{padding:.625rem 1.25rem;font-size:.875rem;font-weight:500;border-radius:.5rem;border:1px solid transparent}
.btn-primary{color:#fff;background:var(--accent)}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:#fff;border-color:#C9D0C7}
.btn-secondary:hover{background:var(--bg)}
.btn.is-disabled{opacity:.6;cursor:not-allowed}
.btn.is-disabled:hover{background:var(--accent)}
.error .btn{margin-top:1.25rem}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.modal.open{display:flex}
@media(min-width:640px){.modal{align-items:center;padding:1.5rem}}
.panel{display:flex;flex-direction:column;width:100%;max-width:32rem;max-height:92vh;overflow:hidden;background:#fff;border-radius:1rem 1rem 0 0;box-shadow:0 25px 50px -12px rgba(0,0,0,.35)}
@media(min-width:640px){.panel{border-radius:1rem}}
.panel-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-bottom:1px solid var(--line-soft)}
.panel-bar h2{font-size:.875rem;font-weight:600}
.close{padding:.5rem;line-height:0;color:var(--muted);background:none;border:0;border-radius:.5rem}
.close:hover{background:var(--tile)}
.close svg{width:1.25rem;height:1.25rem}
.panel-body{overflow-y:auto;padding:1.25rem}
.panel-head{display:flex;align-items:center;gap:1rem}
.panel-name{font-size:1.125rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.panel-version{margin-top:.125rem;font-size:.875rem;color:var(--muted)}
.panel-desc{margin-top:1rem;font-size:.875rem;line-height:1.5rem;color:var(--muted)}
.meta{margin-top:1.25rem;font-size:.875rem;border:1px solid var(--line);border-radius:.5rem}
.meta-row{display:flex;gap:1rem;padding:.625rem 1rem}
.meta-row+.meta-row{border-top:1px solid #E6EAE4}
.meta-row dt{width:7.5rem;flex-shrink:0;color:var(--muted)}
.meta-row dd{min-width:0;font-weight:500;overflow-wrap:anywhere}
.progress{margin-top:1.25rem}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;font-size:.875rem}
.progress-top span:first-child{font-weight:500}
.progress-top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:.5rem;overflow:hidden;background:#E3E7E2;border-radius:999px}
.bar{height:100%;background:var(--accent);border-radius:999px;transition:width .2s linear}
.status{min-height:1.25rem;margin-top:1rem;font-size:.875rem;color:var(--muted)}
.panel-foot{display:flex;flex-direction:column-reverse;gap:.75rem;padding:1rem 1.25rem;border-top:1px solid var(--line-soft)}
@media(min-width:640px){.panel-foot{flex-direction:row;justify-content:flex-end}}

@media(prefers-reduced-motion:reduce){.skeleton{animation:none}.bar,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1 class="title">Software library</h1>
      <p id="count" class="count" aria-live="polite">Loading apps</p>
    </div>
    <div class="search">
      <label for="search" class="sr-only">Search apps</label>
      <input id="search" type="search" placeholder="Search apps" autocomplete="off">
    </div>
  </header>

  <main>
    <div id="loading" class="grid" aria-hidden="true"></div>
    <div id="grid" class="grid hidden"></div>

    <div id="empty" class="empty hidden">
      <p id="empty-text" class="empty-title">No apps found</p>
      <p id="empty-sub" class="empty-sub">Try a different search term.</p>
    </div>

    <div id="error" class="error hidden" role="alert">
      <h2 class="error-title">Couldn't load the software list</h2>
      <p id="error-message" class="error-msg"></p>
      <button id="retry-btn" type="button" class="btn btn-primary">Try again</button>
    </div>
  </main>
</div>

<div id="modal" class="modal">
  <div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="panel-bar">
      <h2 id="modal-title">Download &amp; Install</h2>
      <button id="close-btn" type="button" class="close" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div id="modal-head" class="panel-head"></div>
      <p id="modal-desc" class="panel-desc"></p>
      <dl id="modal-meta" class="meta"></dl>
      <div id="progress-wrap" class="progress hidden">
        <div class="progress-top">
          <span id="progress-label">Preparing files</span>
          <span id="progress-value">0%</span>
        </div>
        <div id="progress-track" class="track" role="progressbar" aria-label="Installation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="bar" style="width:0%"></div>
        </div>
      </div>
      <p id="status-line" class="status" aria-live="polite"></p>
    </div>
    <div class="panel-foot">
      <button id="download-btn" type="button" class="btn btn-secondary">Download</button>
      <button id="install-btn" type="button" class="btn btn-primary">Install</button>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'https://dn721605.ca.archive.org/0/items/ps4-fpkg-collection-english-fpkgi/GAMES.json';
const REQUEST_TIMEOUT_MS = 12000;
const KEY_ORDER = ['name', 'version', 'title_id', 'id', 'region', 'release', 'size', 'min_fw', 'downloadUrl'];
const HIDDEN_KEYS = ['icon', 'description', 'cover_url'];
const KEY_LABELS = {
  id: 'ID',
  title_id: 'Title ID',
  min_fw: 'Min firmware',
  release: 'Release date',
  downloadUrl: 'Download URL'
};

const state = {
  apps: [],
  query: '',
  selected: null,
  installing: false,
  timer: null,
  lastFocus: null
};

const $ = (id) => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== '';
}

function formatVersion(version) {
  if (!version) return 'Unversioned';
  return /^\d/.test(version) ? 'v' + version : version;
}

function formatBytes(value) {
  const bytes = Number(value);
  if (!Number.isFinite(bytes) || bytes <= 0) return '';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let size = bytes;
  let unit = 0;
  while (size >= 1024 && unit < units.length - 1) {
    size /= 1024;
    unit += 1;
  }
  return (unit === 0 ? String(size) : size.toFixed(size >= 100 ? 0 : 1)) + ' ' + units[unit];
}

function humanizeKey(key) {
  if (KEY_LABELS[key]) return KEY_LABELS[key];
  const spaced = key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').trim();
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}

function formatValue(key, value) {
  if (key === 'size') return formatBytes(value) || 'Not provided';
  if (!hasValue(value)) return 'Not provided';
  if (Array.isArray(value)) return value.join(', ');
  if (typeof value === 'object') return JSON.stringify(value);
  return String(value);
}

function slugify(text) {
  return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'app';
}

function buildDescription(item) {
  const parts = [];
  if (hasValue(item.region)) parts.push('Region ' + item.region + '.');
  if (hasValue(item.release)) parts.push('Released ' + item.release + '.');
  const size = formatBytes(item.size);
  if (size) parts.push('Download size ' + size + '.');
  if (hasValue(item.min_fw)) parts.push('Requires firmware ' + item.min_fw + ' or later.');
  return parts.join(' ');
}

function extractItems(data) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== 'object') {
    throw new Error('The data was not in a format this page understands.');
  }
  const source = data.DATA !== undefined ? data.DATA : data.data !== undefined ? data.data : data;
  if (Array.isArray(source)) return source;
  if (!source || typeof source !== 'object') {
    throw new Error('The data was not in a format this page understands.');
  }
  return Object.entries(source)
    .filter(([, value]) => value && typeof value === 'object' && !Array.isArray(value))
    .map(([key, value]) => (/^https?:\/\//i.test(key) ? { downloadUrl: key, ...value } : { id: key, ...value }));
}

function normalize(item, index) {
  const id = hasValue(item.id) ? item.id : hasValue(item.title_id) ? item.title_id : index + 1;
  return {
    ...item,
    id: String(id),
    name: hasValue(item.name) ? String(item.name) : hasValue(item.title) ? String(item.title) : 'Untitled app',
    version: hasValue(item.version) ? String(item.version) : '',
    icon: hasValue(item.icon) ? String(item.icon) : hasValue(item.cover_url) ? String(item.cover_url) : '',
    description: hasValue(item.description) ? String(item.description) : buildDescription(item),
    downloadUrl: hasValue(item.downloadUrl) ? String(item.downloadUrl) : ''
  };
}

function setView(view) {
  ['loading', 'grid', 'empty', 'error'].forEach((name) => {
    $(name).classList.toggle('hidden', name !== view);
  });
}

function renderSkeletons() {
  const nodes = [];
  for (let i = 0; i < 8; i += 1) {
    const card = el('div', 'sk-card');
    const row = el('div', 'sk-row');
    row.appendChild(el('div', 'skeleton icon-md'));
    const lines = el('div', 'sk-lines');
    const lineA = el('div', 'skeleton');
    lineA.style.cssText = 'height:1rem;width:66%';
    const lineB = el('div', 'skeleton');
    lineB.style.cssText = 'height:.75rem;width:25%';
    lines.append(lineA, lineB);
    row.appendChild(lines);
    card.appendChild(row);
    const body = el('div', 'sk-body');
    ['100%', '83%', '66%'].forEach((width) => {
      const line = el('div', 'skeleton');
      line.style.cssText = 'height:.75rem;width:' + width;
      body.appendChild(line);
    });
    card.appendChild(body);
    nodes.push(card);
  }
  $('loading').replaceChildren(...nodes);
}

function createIcon(app, sizeClass) {
  const box = el('div', 'icon ' + sizeClass);
  const showFallback = () => {
    const initial = (app.name.trim().charAt(0) || '?').toUpperCase();
    box.replaceChildren(el('span', 'icon-initial', initial));
  };
  if (!app.icon) {
    showFallback();
    return box;
  }
  const img = document.createElement('img');
  img.src = app.icon;
  img.alt = '';
  img.loading = 'lazy';
  img.referrerPolicy = 'no-referrer';
  img.addEventListener('error', showFallback);
  box.appendChild(img);
  return box;
}

function createCard(app) {
  const card = el('button', 'card');
  card.type = 'button';

  const top = el('div', 'card-top');
  top.appendChild(createIcon(app, 'icon-md'));
  const titles = el('div', 'card-titles');
  titles.appendChild(el('h3', 'card-name', app.name));
  titles.appendChild(el('span', 'pill', formatVersion(app.version)));
  top.appendChild(titles);
  card.appendChild(top);

  card.appendChild(el('p', 'card-desc', app.description || 'No description provided.'));
  card.appendChild(el('span', 'card-cta', 'Download & Install'));

  card.addEventListener('click', () => openModal(app, card));
  return card;
}

function renderGrid() {
  const query = state.query.trim().toLowerCase();
  const list = state.apps.filter((app) => {
    if (!query) return true;
    return [app.name, app.description, app.id].some((value) => String(value).toLowerCase().includes(query));
  });

  if (!state.apps.length) {
    $('empty-text').textContent = 'The software list is empty';
    $('empty-sub').textContent = 'The data loaded, but it has no items yet.';
    $('count').textContent = '0 apps';
    setView('empty');
    return;
  }

  $('count').textContent = query
    ? list.length + ' of ' + state.apps.length + ' apps'
    : state.apps.length + (state.apps.length === 1 ? ' app' : ' apps');

  if (!list.length) {
    $('empty-text').textContent = 'No apps match "' + state.query.trim() + '"';
    $('empty-sub').textContent = 'Try a different search term.';
    setView('empty');
    return;
  }

  $('grid').replaceChildren(...list.map(createCard));
  setView('grid');
}

function describeError(error) {
  if (error && error.name === 'AbortError') return 'The request timed out. Check your connection and try again.';
  if (error instanceof SyntaxError) return 'The server responded, but the data was not valid JSON.';
  if (error instanceof TypeError) return 'The network request failed. Check your internet connection and try again.';
  return (error && error.message) || 'Something went wrong while loading the data.';
}

async function loadApps() {
  setView('loading');
  $('count').textContent = 'Loading apps';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    const response = await fetch(DATA_URL, { signal: controller.signal, cache: 'no-store' });
    if (!response.ok) throw new Error('The server responded with status ' + response.status + '.');
    const data = await response.json();
    state.apps = extractItems(data).filter((item) => item && typeof item === 'object').map(normalize);
    renderGrid();
  } catch (error) {
    $('error-message').textContent = describeError(error);
    $('count').textContent = 'Unavailable';
    setView('error');
  } finally {
    clearTimeout(timeout);
  }
}

function setInstallButton(label, disabled) {
  const button = $('install-btn');
  button.textContent = label;
  button.setAttribute('aria-disabled', String(disabled));
  button.classList.toggle('is-disabled', disabled);
}

function updateProgress(value) {
  const rounded = Math.round(value);
  $('progress-bar').style.width = rounded + '%';
  $('progress-value').textContent = rounded + '%';
  $('progress-track').setAttribute('aria-valuenow', String(rounded));
  let label = 'Preparing files';
  if (rounded >= 100) label = 'Installed';
  else if (rounded >= 90) label = 'Finishing up';
  else if (rounded >= 60) label = 'Configuring';
  else if (rounded >= 25) label = 'Copying files';
  $('progress-label').textContent = label;
}

function resetInstall() {
  clearInterval(state.timer);
  state.timer = null;
  state.installing = false;
  $('progress-wrap').classList.add('hidden');
  updateProgress(0);
  setInstallButton('Install', false);
}

function renderMeta(app) {
  const hidden = HIDDEN_KEYS.concat(hasValue(app.title_id) ? ['id'] : []);
  const keys = KEY_ORDER.filter((key) => key in app && !hidden.includes(key))
    .concat(Object.keys(app).filter((key) => !KEY_ORDER.includes(key) && !hidden.includes(key)));
  const rows = keys.map((key) => {
    const row = el('div', 'meta-row');
    row.appendChild(el('dt', '', humanizeKey(key)));
    row.appendChild(el('dd', '', formatValue(key, app[key])));
    return row;
  });
  $('modal-meta').replaceChildren(...rows);
}

function openModal(app, trigger) {
  resetInstall();
  state.selected = app;
  state.lastFocus = trigger || null;

  const titles = el('div');
  titles.style.minWidth = '0';
  titles.appendChild(el('h3', 'panel-name', app.name));
  titles.appendChild(el('p', 'panel-version', app.version ? 'Version ' + app.version : 'Version not specified'));
  $('modal-head').replaceChildren(createIcon(app, 'icon-lg'), titles);

  $('modal-desc').textContent = app.description || 'No description provided.';
  renderMeta(app);
  $('status-line').textContent = '';

  $('modal').classList.add('open');
  document.body.classList.add('locked');
  $('close-btn').focus();
}

function closeModal() {
  resetInstall();
  $('modal').classList.remove('open');
  document.body.classList.remove('locked');
  state.selected = null;
  if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
  state.lastFocus = null;
}

function startDownload() {
  const app = state.selected;
  if (!app) return;
  const content = [
    'Placeholder installer for ' + app.name + ' ' + formatVersion(app.version),
    'ID: ' + app.id,
    'Source: ' + (app.downloadUrl || 'Not provided'),
    'This file is a simulated download and does not contain real software.'
  ].join('\n');
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const filename = slugify(app.name) + '-' + slugify(app.version || 'latest') + '-setup.txt';
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  $('status-line').textContent = 'Download started: ' + filename;
}

function startInstall() {
  const app = state.selected;
  if (!app || state.installing || $('install-btn').getAttribute('aria-disabled') === 'true') return;

  state.installing = true;
  $('status-line').textContent = '';
  $('progress-wrap').classList.remove('hidden');
  setInstallButton('Installing', true);

  let progress = 0;
  updateProgress(progress);
  state.timer = setInterval(() => {
    progress = Math.min(100, progress + Math.random() * 9 + 3);
    updateProgress(progress);
    if (progress >= 100) {
      clearInterval(state.timer);
      state.timer = null;
      state.installing = false;
      setInstallButton('Installed', true);
      $('status-line').textContent = 'Installation complete.';
      setTimeout(() => {
        if (state.selected === app) {
          alert(app.name + ' ' + formatVersion(app.version) + ' was installed successfully.');
        }
      }, 200);
    }
  }, 180);
}

$('download-btn').addEventListener('click', startDownload);
$('install-btn').addEventListener('click', startInstall);
$('close-btn').addEventListener('click', closeModal);
$('retry-btn').addEventListener('click', loadApps);

$('modal').addEventListener('click', (event) => {
  if (event.target === $('modal')) closeModal();
});

$('search').addEventListener('input', (event) => {
  state.query = event.target.value;
  if (state.apps.length) renderGrid();
});

document.addEventListener('keydown', (event) => {
  if (!$('modal').classList.contains('open')) return;
  if (event.key === 'Escape') {
    closeModal();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = Array.from($('panel').querySelectorAll('button:not([disabled])'));
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (!$('panel').contains(document.activeElement)) {
    event.preventDefault();
    first.focus();
  } else if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

renderSkeletons();
loadApps();
</script>
</body>
</html>
